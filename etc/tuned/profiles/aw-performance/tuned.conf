[main]
summary=Alienware performance profile
description=Extends throughput-performance with platform-profile set to performance. Disables deep C-states and NMI watchdog for low-latency gaming workloads.
include=throughput-performance

[cpu]
force_latency=1
energy_perf_bias=performance

[vm]
transparent_hugepages=madvise

[sysctl]
kernel.nmi_watchdog=0
vm.swappiness=10
net.core.netdev_max_backlog=16384

[scsi_host]
linkpowermanagement=

[acpi]
platform_profile = performance|balanced-performance